<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe066">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Joguinhos">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Joguinhos</title>
<style>
  html, body {
    margin: 0; min-height: 100%;
    background: linear-gradient(#ffe066, #ffb3d9);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, sans-serif;
  }
  main {
    min-height: 100vh; display: flex; flex-wrap: wrap;
    align-content: center; justify-content: center; gap: 6vmin; padding: 6vmin;
    box-sizing: border-box;
  }
  a {
    width: 38vmin; height: 38vmin; border-radius: 9vmin;
    display: grid; place-items: center; font-size: 20vmin; text-decoration: none;
    background: #fff; box-shadow: 0 2vmin 0 #0002, 0 4vmin 6vmin #0002;
    transition: transform .1s;
  }
  a:active { transform: scale(.92) translateY(1vmin); }
</style>
</head>
<body>
<main>
  <!-- cada jogo novo = uma pasta + um link aqui -->
  <a href="bolhinhas/" aria-label="Bolhinhas">🫧</a>
</main>
</body>
</html>
