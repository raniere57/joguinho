<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d9f5ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Joguinhos">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-180.png">
<title>Colorir</title>
<link rel="stylesheet" href="../comum/ui.css">
<style>
  :root { --play-a: #7ee0b0; --play-b: #33b87a; --play-shadow: #218a58; }
  /* paleta: bolotas de tinta; em pé fica embaixo, deitado fica do lado */
  .tray {
    --b: min(14.5vw, 62px, 15vh);
    position: fixed; z-index: 1; left: 50%; bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%); width: calc(var(--b) * 5 + 64px); box-sizing: border-box;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    padding: 10px; border-radius: 32px;
    background: rgb(255 255 255 / .62);
    box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / .9), 0 8px 24px rgb(30 90 70 / .18);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: opacity .3s ease;
  }
  @media (orientation: landscape) {
    .tray {
      left: auto; bottom: auto; top: 50%; right: max(14px, env(safe-area-inset-right));
      transform: translateY(-50%); width: auto; height: calc(var(--b) * 5 + 64px);
      flex-direction: column;
    }
  }
  .tray:not(.on) { opacity: 0; pointer-events: none; }
  .tray button {
    width: var(--b); aspect-ratio: 1; border-radius: 50%; font-size: calc(var(--b) * .55); line-height: 1;
    background: radial-gradient(ellipse 34% 24% at 36% 28%, rgb(255 255 255 / .85), transparent), var(--c);
    box-shadow: inset 0 -5px 0 rgb(0 0 0 / .14), 0 4px 10px rgb(30 60 50 / .22);
    transition: transform .15s cubic-bezier(.34, 1.56, .64, 1), box-shadow .15s ease;
    touch-action: manipulation;
  }
  .tray button.rainbow { --c: conic-gradient(#ff4d4d, #ff9a3c, #ffd93b, #5cd65c, #4da6ff, #a066ff, #ff7ac8, #ff4d4d); }
  .tray button:active { transform: scale(.88); }
  .tray button.on { transform: scale(1.14); box-shadow: inset 0 -5px 0 rgb(0 0 0 / .14), 0 0 0 4px #fff, 0 0 0 7px #3a2e4a, 0 6px 14px rgb(30 60 50 / .3); }
  /* galeria de desenhos: rola com o dedo */
  .gallery {
    position: fixed; inset: 0; z-index: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    box-sizing: border-box; padding: calc(max(14px, env(safe-area-inset-top)) + 72px) 20px calc(28px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(38vw, 180px), 1fr)); gap: 20px; align-content: start;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .gallery.on { opacity: 1; pointer-events: auto; }
  .card {
    position: relative; aspect-ratio: 1; border-radius: 24px; touch-action: pan-y;
    background: #fffdf8; transform: rotate(var(--r));
    box-shadow: inset 0 0 0 1.5px #fff, 0 8px 20px rgb(30 70 60 / .18);
    transition: transform .15s ease;
  }
  .gallery.on .card { animation: card-in .45s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--i) * .03s); }
  .card canvas { position: static; width: 100%; height: 100%; display: block; border-radius: 24px; }
  .card.done::after { content: '⭐'; position: absolute; right: -8px; top: -10px; font-size: 30px; filter: drop-shadow(0 2px 3px rgb(0 0 0 / .2)); }
  .card:active { transform: scale(.93) rotate(var(--r)); }
  @keyframes card-in { from { opacity: 0; transform: scale(.5) rotate(var(--r)); } }
  /* voltar pra galeria (canto de cima) e ver o desenho vivo de novo */
  .back {
    position: fixed; z-index: 2;
    top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right));
    width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
    background: rgb(255 255 255 / .75);
    box-shadow: inset 0 0 0 1.5px #fff, 0 4px 14px rgb(30 70 60 / .2);
    touch-action: manipulation;
  }
  .back svg { width: 56%; fill: #33b87a; }
  .back.pulse { animation: breathe 1.3s ease-in-out infinite; box-shadow: inset 0 0 0 1.5px #fff, 0 0 0 5px rgb(51 184 122 / .35), 0 4px 14px rgb(30 70 60 / .2); }
  .back[hidden], .magic[hidden] { display: none; }
  .magic {
    position: fixed; z-index: 1; width: 76px; aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center; font-size: 36px; line-height: 1;
    background: radial-gradient(ellipse 30% 18% at 36% 24%, rgb(255 255 255 / .9), transparent), radial-gradient(circle at 50% 55%, #c9a4ff, #8a5cf0);
    box-shadow: 0 6px 0 #6d45c0, 0 10px 22px rgb(80 40 140 / .35);
    animation: magic-in .45s cubic-bezier(.34, 1.56, .64, 1) both, breathe 1.4s ease-in-out .45s infinite;
    touch-action: manipulation;
  }
  .magic:active { transform: scale(.9); }
  @keyframes magic-in { from { opacity: 0; transform: scale(.3) rotate(-30deg); } }
  @keyframes breathe { 50% { transform: scale(1.1) rotate(-4deg); } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="home" aria-label="Voltar ao menu">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <circle class="track" cx="24" cy="24" r="21"/>
    <circle class="ring" cx="24" cy="24" r="21"/>
    <path d="M13 24.5 24 15l11 9.5M16 22.5V34h6v-6h4v6h6V22.5"/>
  </svg>
</button>

<button id="start" aria-label="Jogar">
  <span class="play">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M38 28c0-4 4-6 7-4l30 20c3 2 3 6 0 8L45 72c-3 2-7 0-7-4Z"/></svg>
  </span>
</button>

<nav class="tray" aria-label="Cores"></nav>
<section class="gallery" aria-label="Desenhos"></section>
<button class="back" type="button" aria-label="Escolher outro desenho" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2.2"/><rect x="13" y="3" width="8" height="8" rx="2.2"/><rect x="3" y="13" width="8" height="8" rx="2.2"/><rect x="13" y="13" width="8" height="8" rx="2.2"/></svg>
</button>
<button class="magic" type="button" aria-label="Ver o desenho ganhar vida" hidden>✨</button>

<script src="../comum/base.js"></script>
<script src="../comum/efeitos.js"></script>
<script src="../comum/som.js"></script>
<script src="../comum/medidor.js"></script>
<script src="../comum/ui.js"></script>
<script src="desenhos.js"></script>
<script src="vida.js"></script>
<script src="game.js"></script>
</body>
</html>
