<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd6c2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Joguinhos">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-180.png">
<title>Bolo de aniversário</title>
<link rel="stylesheet" href="../comum/ui.css">
<style>
  :root { --play-a: #ffb46b; --play-b: #ff7a59; --play-shadow: #d4553a; }
  /* bandeja de escolhas: muda a cada etapa do bolo */
  .tray {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 1;
    transform: translateX(-50%); display: flex; gap: min(3vw, 18px);
    padding: 10px; border-radius: 999px;
    background: rgb(255 255 255 / .6);
    box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / .9), 0 8px 24px rgb(140 60 40 / .2);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: opacity .3s ease, transform .3s ease;
  }
  .tray:not(.on) { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(30px); }
  .tray button {
    position: relative; width: min(15vw, 70px); aspect-ratio: 1; border-radius: 50%;
    font-size: min(8vw, 36px); line-height: 1;
    background: radial-gradient(circle at 40% 30%, #fff, var(--c, #fff1e6));
    box-shadow: inset 0 -5px 0 rgb(0 0 0 / .08), 0 4px 0 rgb(180 110 80 / .35), 0 6px 14px rgb(140 60 40 / .18);
    transition: transform .12s ease;
    touch-action: manipulation;
    animation: tray-in .35s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--i) * .06s);
  }
  .tray button:active { transform: scale(.9) translateY(3px); }
  .tray button.on { box-shadow: 0 4px 0 #f0b93a, 0 0 0 5px rgb(255 210 70 / .7), 0 6px 18px rgb(240 170 40 / .5); transform: scale(1.08); }
  .tray button.hint::after {
    content: '👆'; position: absolute; left: 50%; top: 100%; font-size: .8em;
    transform: translateX(-30%); animation: point .7s ease-in-out infinite alternate;
  }
  @keyframes tray-in { from { opacity: 0; transform: scale(.4) translateY(20px); } }
  @keyframes point { to { translate: 0 -10px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="home" aria-label="Voltar ao menu">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <circle class="track" cx="24" cy="24" r="21"/>
    <circle class="ring" cx="24" cy="24" r="21"/>
    <path d="M13 24.5 24 15l11 9.5M16 22.5V34h6v-6h4v6h6V22.5"/>
  </svg>
</button>

<button id="start" aria-label="Jogar">
  <span class="play">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M38 28c0-4 4-6 7-4l30 20c3 2 3 6 0 8L45 72c-3 2-7 0-7-4Z"/></svg>
  </span>
</button>

<nav class="tray" aria-label="Escolhas"></nav>

<script src="../comum/base.js"></script>
<script src="../comum/efeitos.js"></script>
<script src="../comum/som.js"></script>
<script src="../comum/medidor.js"></script>
<script src="../comum/ui.js"></script>
<script src="game.js"></script>
</body>
</html>
