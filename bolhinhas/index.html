<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7ec8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bolhinhas">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Bolhinhas</title>
<style>
  :root { --sky-top: #7ec8ff; --sky-bottom: #d9f3ff; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #start {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  #start span {
    width: 44vmin; height: 44vmin; border-radius: 50%;
    display: grid; place-items: center; font-size: 22vmin;
    background: radial-gradient(circle at 35% 30%, #fff9, #ffb3d9 40%, #ff6fb5);
    box-shadow: 0 2vmin 0 #d94d94, 0 4vmin 8vmin #0003;
    animation: pulse 1.2s ease-in-out infinite;
  }
  #home {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px;
    width: 48px; height: 48px; border: 0; border-radius: 50%;
    background: #fff6; font-size: 26px; opacity: .6;
  }
  #home.holding { transition: transform 1s linear; transform: scale(1.5); opacity: 1; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="home" aria-label="Voltar ao menu (segure)">🏠</button>
<button id="start" aria-label="Jogar"><span>▶️</span></button>
<script>
const ANIMALS = [
  ['🐶', 'Cachorro! Au au!'], ['🐱', 'Gato! Miau!'], ['🐮', 'Vaca! Muuu!'],
  ['🐷', 'Porquinho! Óinc óinc!'], ['🐸', 'Sapo! Croac!'], ['🦁', 'Leão! Roar!'],
  ['🐵', 'Macaco! U u a a!'], ['🐰', 'Coelho!'], ['🐔', 'Galinha! Có có có!'],
  ['🦆', 'Pato! Quá quá!'], ['🐘', 'Elefante!'], ['🐴', 'Cavalo! Iirrí!'],
  ['🐑', 'Ovelha! Méé!'], ['🐟', 'Peixinho!'], ['🐻', 'Urso!'],
  ['🐯', 'Tigre!'], ['🦒', 'Girafa!'], ['🐢', 'Tartaruga!'],
];
const MAX_BUBBLES = 6;
const CELEBRATE_EVERY = 10;
const PENTATONIC = [523, 587, 659, 784, 880, 1047];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, R = 0;
let bubbles = [], particles = [], pops = 0, lastSpawn = 0, audio = null, voice = null;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  R = Math.min(W, H) * 0.15;
}
addEventListener('resize', resize);
resize();

// --- som ---
function tone(freq, dur, type = 'sine', vol = 0.3, slideTo) {
  if (!audio) return;
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + dur);
}
const popSound = () => tone(900, 0.15, 'sine', 0.4, 200);
const noteSound = () => tone(PENTATONIC[Math.random() * PENTATONIC.length | 0], 0.4, 'triangle', 0.2);
function fanfare() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'triangle', 0.25), i * 120));
}

function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => v.lang === 'pt-BR') || vs.find(v => v.lang.startsWith('pt')) || null;
}
function say(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'pt-BR'; u.rate = 0.9; u.pitch = 1.3;
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

// --- bolhas e partículas ---
function spawn() {
  const [emoji, name] = ANIMALS[Math.random() * ANIMALS.length | 0];
  const r = R * (0.85 + Math.random() * 0.3);
  // sorteia 5 posições e fica com a mais longe das bolhas existentes, pra não empilhar
  const dist = x => Math.min(Infinity, ...bubbles.map(b => Math.hypot(x - b.x, H + r - b.y)));
  const x = Array.from({ length: 5 }, () => r + Math.random() * (W - 2 * r))
    .reduce((best, c) => dist(c) > dist(best) ? c : best);
  bubbles.push({
    x, y: H + r, r, emoji, name,
    vy: H * (0.08 + Math.random() * 0.05), phase: Math.random() * 6.28,
    hue: Math.random() * 360,
  });
}

function burst(x, y, hue, n, big) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = (big ? 400 : 200) * (0.4 + Math.random());
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (big ? 200 : 0),
      life: 1, hue: hue + Math.random() * 60, size: 4 + Math.random() * (big ? 10 : 6),
      star: Math.random() < 0.5,
    });
  }
}

function celebrate() {
  fanfare();
  say('Muito bem!');
  for (let i = 0; i < 5; i++) burst(Math.random() * W, Math.random() * H * 0.6, Math.random() * 360, 30, true);
}

function hit(x, y) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (Math.hypot(x - b.x, y - b.y) < b.r * 1.25) {
      bubbles.splice(i, 1);
      popSound();
      burst(b.x, b.y, b.hue, 24);
      pops++;
      if (pops % CELEBRATE_EVERY === 0) celebrate(); else say(b.name);
      return;
    }
  }
  noteSound();
  burst(x, y, Math.random() * 360, 10);
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (audio && audio.state === 'suspended') audio.resume();
  hit(e.clientX, e.clientY);
});
addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// --- desenho ---
function drawStar(x, y, s) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? s / 2 : s;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.fill();
}

function drawBubble(b, t) {
  const wobble = 1 + Math.sin(t * 3 + b.phase) * 0.04;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.scale(wobble, 2 - wobble);
  const g = ctx.createRadialGradient(-b.r * 0.35, -b.r * 0.35, b.r * 0.1, 0, 0, b.r);
  g.addColorStop(0, 'rgba(255,255,255,0.9)');
  g.addColorStop(0.5, `hsla(${b.hue},90%,75%,0.35)`);
  g.addColorStop(1, `hsla(${b.hue},90%,55%,0.7)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.28); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = `hsla(${b.hue},90%,95%,0.9)`; ctx.stroke();
  ctx.font = `${b.r * 1.1}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.emoji, 0, b.r * 0.08);
  ctx.restore();
}

let prev = performance.now();
function frame(now) {
  const dt = Math.min((now - prev) / 1000, 0.05), t = now / 1000;
  prev = now;

  if (bubbles.length < MAX_BUBBLES && now - lastSpawn > 1400) { spawn(); lastSpawn = now; }

  ctx.clearRect(0, 0, W, H);
  bubbles = bubbles.filter(b => b.y > -b.r * 1.5);
  for (const b of bubbles) {
    b.y -= b.vy * dt;
    b.x += Math.sin(t * 1.5 + b.phase) * 20 * dt;
    drawBubble(b, t);
  }

  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt * 1.2;
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = `hsl(${p.hue},95%,60%)`;
    if (p.star) drawStar(p.x, p.y, p.size * 1.5);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.28); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

// segurar 1s pra voltar ao menu: toque rápido da criança não sai do jogo
const home = document.getElementById('home');
let holdTimer;
home.addEventListener('pointerdown', () => {
  home.classList.add('holding');
  holdTimer = setTimeout(() => location.href = '../', 1000);
});
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) {
  home.addEventListener(ev, () => { clearTimeout(holdTimer); home.classList.remove('holding'); });
}

document.getElementById('start').addEventListener('click', e => {
  e.currentTarget.remove();
  audio = new (window.AudioContext || window.webkitAudioContext)();
  document.documentElement.requestFullscreen?.().catch(() => {});
  navigator.wakeLock?.request('screen').catch(() => {});
  say('Vamos estourar as bolhas!');
  popSound();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
